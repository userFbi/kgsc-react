<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kamlaba Garden Sport Club — Login / Sign Up</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --ink: #11120d;
        --forest-900: #11120d;
        --forest-800: #1c1d17;
        --forest-700: #565449;
        --leaf-400: #d8cfbc;
        --leaf-300: #ece6d8;
        --cream-100: #e8e1d1;
        --paper: #fffaf0;
        --marigold-500: #565449;
        --marigold-600: #403f37;
        --line: rgba(22, 35, 58, 0.14);
        --line-on-dark: rgba(255, 255, 255, 0.16);
        --radius-lg: 22px;
        --radius-md: 14px;
        --radius-sm: 9px;
        --shadow-soft: 0 10px 30px rgba(17, 18, 13, 0.14);
        --shadow-strong: 0 20px 50px rgba(17, 18, 13, 0.32);
        --font-display: "Fraunces", serif;
        --font-body: "Inter", sans-serif;
        --font-mono: "Space Mono", monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        background: linear-gradient(
          180deg,
          var(--forest-900) 0%,
          var(--forest-800) 55%,
          #0a0a08 100%
        );
        color: var(--ink);
        font-family: var(--font-body);
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
      }

      .field-lines {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(
            circle at 82% 8%,
            rgba(216, 207, 188, 0.14),
            transparent 55%
          ),
          radial-gradient(
            circle at 10% 92%,
            rgba(86, 84, 73, 0.3),
            transparent 45%
          );
        pointer-events: none;
      }

      .wrap {
        position: relative;
        z-index: 1;
        max-width: 640px;
        margin: 0 auto;
        padding: 56px 24px 80px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.35);
        backdrop-filter: blur(6px);
        color: var(--paper);
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 24px;
        letter-spacing: 0.02em;
        margin-bottom: 24px;
        opacity: 0;
        animation: rise 0.6s ease 0.1s forwards;
      }

      h1 {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: clamp(36px, 8vw, 56px);
        line-height: 1;
        letter-spacing: -0.01em;
        color: var(--paper);
        margin: 0 0 14px;
        opacity: 0;
        animation: rise 0.7s ease 0.15s forwards;
      }

      h1 span {
        color: var(--marigold-500);
        display: block;
        font-weight: 500;
      }

      .lede {
        font-size: 17px;
        line-height: 1.55;
        color: var(--leaf-300);
        max-width: 46ch;
        margin: 0 0 40px;
        opacity: 0;
        animation: rise 0.7s ease 0.22s forwards;
      }

      .card {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        padding: 32px;
        box-shadow: var(--shadow-strong);
        opacity: 0;
        animation: rise 0.7s ease 0.3s forwards;
      }

      .tabs {
        display: flex;
        background: var(--cream-100);
        border-radius: var(--radius-sm);
        padding: 4px;
        margin-bottom: 24px;
        border: 1px solid var(--line);
      }

      .tab-btn {
        flex: 1;
        padding: 12px 10px;
        border: none;
        background: transparent;
        border-radius: 9px;
        font-family: var(--font-body);
        font-weight: 700;
        font-size: 14px;
        color: rgba(17, 18, 13, 0.5);
        cursor: pointer;
        transition:
          background 0.2s ease,
          color 0.2s ease;
      }

      .tab-btn.active {
        background: var(--forest-900);
        color: var(--paper);
      }

      .card-title {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 24px;
        letter-spacing: -0.01em;
        color: var(--forest-900);
        margin: 0 0 22px;
      }

      form {
        display: none;
        flex-direction: column;
        gap: 16px;
      }

      form.active {
        display: flex;
      }

      label {
        font-size: 13px;
        font-weight: 600;
        color: var(--forest-900);
        margin-bottom: -8px;
      }

      input[type="text"],
      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 15px 16px;
        border-radius: var(--radius-sm);
        border: 1.5px solid var(--line);
        background: var(--cream-100);
        font-family: var(--font-body);
        font-size: 16px;
        color: var(--ink);
        outline: none;
        transition:
          border-color 0.15s ease,
          background 0.15s ease;
      }

      input:focus {
        border-color: var(--marigold-500);
        background: #fff;
      }

      button[type="submit"],
      .btn-next {
        margin-top: 6px;
        padding: 16px 20px;
        border: none;
        border-radius: var(--radius-sm);
        background: var(--forest-900);
        color: var(--paper);
        font-family: var(--font-body);
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        transition:
          transform 0.12s ease,
          background 0.15s ease;
      }

      button[type="submit"]:hover,
      .btn-next:hover {
        background: var(--forest-800);
      }

      button:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .error {
        font-size: 13px;
        color: #b23a2f;
        display: none;
        line-height: 1.45;
      }

      .error.show {
        display: block;
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 4px 0 -2px;
        color: rgba(17, 18, 13, 0.4);
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }

      .google-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        padding: 14px 18px;
        border-radius: var(--radius-sm);
        border: 1.5px solid var(--line);
        background: #fff;
        color: var(--ink);
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
      }

      .google-btn:hover {
        border-color: var(--marigold-500);
        background: var(--cream-100);
      }

      /* Signup steps */
      .step {
        display: none;
        flex-direction: column;
        gap: 16px;
      }

      .step.active {
        display: flex;
      }

      .step-track {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
      }

      .step-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--line);
      }

      .step-dot.done {
        background: var(--marigold-500);
      }
      .step-dot.current {
        background: var(--forest-900);
        transform: scale(1.3);
      }

      .step-bar {
        flex: 1;
        height: 2px;
        background: var(--line);
        border-radius: 2px;
        overflow: hidden;
      }

      .step-bar span {
        display: block;
        height: 100%;
        width: 0;
        background: var(--marigold-500);
        transition: width 0.25s ease;
      }

      .step-bar.done span {
        width: 100%;
      }

      .step-label {
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--marigold-600);
        margin: -4px 0 2px;
      }

      .otp-row {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 8px;
      }

      .otp-input {
        width: 100%;
        height: 52px;
        text-align: center;
        padding: 0 !important;
        font-size: 20px !important;
        font-weight: 700;
      }

      .otp-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: -4px;
      }

      .text-btn {
        border: none;
        background: transparent;
        padding: 4px 0;
        color: var(--marigold-600);
        font-family: var(--font-body);
        font-weight: 700;
        cursor: pointer;
      }

      .text-btn:hover {
        text-decoration: underline;
      }

      .btn-row {
        display: flex;
        gap: 12px;
        margin-top: 6px;
      }

      .btn-row button[type="submit"],
      .btn-row .btn-next {
        flex: 1;
      }

      .btn-back {
        flex: 1;
        padding: 16px 20px;
        border: 1.5px solid var(--line);
        border-radius: var(--radius-sm);
        background: #fff;
        color: var(--forest-900);
        font-family: var(--font-body);
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
      }

      .field-wrap {
        position: relative;
      }

      .field-wrap input {
        padding-right: 46px;
      }

      .toggle-pw {
        position: absolute;
        right: 6px;
        top: 50%;
        transform: translateY(-50%);
        width: 34px;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: none;
        cursor: pointer;
        color: var(--marigold-600);
        padding: 0;
        border-radius: 8px;
      }

      .toggle-pw:hover {
        background: var(--cream-100);
      }

      .toggle-pw svg {
        width: 20px;
        height: 20px;
      }
      .toggle-pw .eye-off {
        display: none;
      }
      .toggle-pw.shown .eye-on {
        display: none;
      }
      .toggle-pw.shown .eye-off {
        display: block;
      }

      .confirm {
        display: none;
        text-align: center;
        padding: 8px 4px 4px;
      }

      .confirm.show {
        display: block;
      }

      .confirm p {
        font-size: 15px;
        color: rgba(17, 18, 13, 0.72);
        margin: 0 0 4px;
      }

      .confirm strong {
        color: var(--forest-900);
      }

      .wa-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 26px;
        padding: 15px 26px;
        border-radius: 999px;
        background: #25d366;
        color: #fff;
        font-family: var(--font-body);
        font-weight: 700;
        font-size: 15px;
        text-decoration: none;
        box-shadow: 0 8px 20px -8px rgba(37, 211, 102, 0.6);
      }

      .hide {
        display: none !important;
      }

      footer {
        margin-top: 44px;
        font-family: var(--font-mono);
        font-size: 11.5px;
        letter-spacing: 0.06em;
        color: rgba(255, 255, 255, 0.45);
        text-align: center;
        line-height: 1.8;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }

      @media (max-width: 480px) {
        .wrap {
          padding: 40px 18px 60px;
        }
        .card {
          padding: 24px 20px;
        }
        .otp-row {
          gap: 5px;
        }
        .otp-input {
          height: 48px;
        }
      }
    </style>
  </head>

  <body>
    <div class="field-lines"></div>

    <div class="wrap">
      <div class="badge">KG<br /></div>

      <h1>
        Kamlaba Garden
        <br />
        <span>Sport Club</span>
      </h1>

      <p class="lede">
        Log in to your member account, or sign up to join the club.
      </p>

      <div class="card">
        <div class="tabs" id="tabs">
          <button type="button" class="tab-btn active" id="loginTabBtn">
            Login
          </button>
          <button type="button" class="tab-btn" id="signupTabBtn">
            Sign Up
          </button>
        </div>

        <h2 class="card-title" id="cardTitle">Log in to your account</h2>

        <!-- LOGIN -->
        <form id="loginForm" class="active">
          <label for="loginIdentifier">Phone number or Member ID</label>
          <input
            type="text"
            id="loginIdentifier"
            placeholder="e.g. 98765 43210 or KGSC-0001"
            autocomplete="username"
            required
          />

          <label for="loginPassword">Password</label>

          <div class="field-wrap">
            <input
              type="password"
              id="loginPassword"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />

            <button
              type="button"
              class="toggle-pw"
              data-target="loginPassword"
              aria-label="Show password"
            >
              <svg
                class="eye-on"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <path
                  d="M1.5 12s4-7.5 10.5-7.5S22.5 12 22.5 12s-4 7.5-10.5 7.5S1.5 12 1.5 12z"
                />
                <circle cx="12" cy="12" r="3" />
              </svg>

              <svg
                class="eye-off"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <path d="M3 3l18 18" />
                <path
                  d="M10.6 5.1A10.9 10.9 0 0112 5c6.5 0 10.5 7 10.5 7a13.5 13.5 0 01-3.1 3.9M6.6 6.6C3.5 8.5 1.5 12 1.5 12s4 7 10.5 7a10.7 10.7 0 004.4-.9"
                />
                <path d="M9.9 9.9a3 3 0 004.2 4.2" />
              </svg>
            </button>
          </div>

          <div class="error" id="loginError">Please fill in all fields.</div>

          <button type="submit" id="loginSubmitBtn">Log In</button>

          <div class="divider">or</div>

          <button type="button" class="google-btn" id="googleLoginBtn">
            <span
              ><svg width="18" height="18" viewBox="0 0 48 48">
                <path
                  fill="#FFC107"
                  d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"
                />

                <path
                  fill="#FF3D00"
                  d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"
                />

                <path
                  fill="#4CAF50"
                  d="M24 44c5.5 0 10.4-2.1 14.1-5.6l-6.5-5.5c-2 1.5-4.6 2.4-7.6 2.4-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9.6 39.6 16.2 44 24 44z"
                />

                <path
                  fill="#1976D2"
                  d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.2 5.6l6.5 5.5C41.4 36 44 30.6 44 24c0-1.3-.1-2.7-.4-3.5z"
                /></svg
            ></span>
            Continue with Google
          </button>
        </form>

        <!-- SIGNUP -->
        <form id="signupForm">
          <div class="step-track">
            <div class="step-dot current" id="stepDot1"></div>
            <div class="step-bar" id="stepBar"><span></span></div>
            <div class="step-dot" id="stepDot2"></div>
          </div>

          <div class="step-label" id="stepLabel">Step 1 of 2</div>

          <!-- STEP 1 : PHONE + OTP -->
          <div class="step active" id="signupStep1">
            <label for="phoneInput">Phone number</label>

            <input
              type="text"
              id="phoneInput"
              placeholder="e.g. 98765 43210"
              autocomplete="tel"
              inputmode="tel"
              maxlength="10"
              required
            />

            <button type="button" class="btn-next" id="sendOtpBtn">
              Send OTP
            </button>

            <div class="otp-section hide" id="otpSection">
              <label>Enter OTP</label>

              <div class="otp-row">
                <input class="otp-input" maxlength="1" inputmode="numeric" />
                <input class="otp-input" maxlength="1" inputmode="numeric" />
                <input class="otp-input" maxlength="1" inputmode="numeric" />
                <input class="otp-input" maxlength="1" inputmode="numeric" />
                <input class="otp-input" maxlength="1" inputmode="numeric" />
                <input class="otp-input" maxlength="1" inputmode="numeric" />
              </div>

              <div class="otp-actions">
                <span
                  id="otpStatus"
                  style="font-size: 13px; color: rgba(17, 18, 13, 0.65)"
                >
                  OTP sent to your phone.
                </span>

                <button type="button" class="text-btn" id="resendOtpBtn">
                  Resend OTP
                </button>
              </div>

              <div class="error" id="otpError"></div>

              <button type="button" class="btn-next" id="verifyOtpBtn">
                Verify OTP
              </button>
            </div>

            <div class="error" id="signupErrorStep1"></div>

            <div class="divider">or</div>

            <button type="button" class="google-btn" id="googleSignupBtn">
              <span>🌐</span>
              Continue with Google
            </button>
          </div>

          <!-- STEP 2 : PROFILE -->
          <div class="step" id="signupStep2">
            <label for="nameInput">Full name</label>
            <input
              type="text"
              id="nameInput"
              placeholder="e.g. Tushar Pawar"
              autocomplete="name"
              required
            />

            <label for="signupPassword">Create password</label>

            <div class="field-wrap">
              <input
                type="password"
                id="signupPassword"
                placeholder="Create a password"
                minlength="6"
                autocomplete="new-password"
                required
              />

              <button
                type="button"
                class="toggle-pw"
                data-target="signupPassword"
                aria-label="Show password"
              >
                <svg
                  class="eye-on"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <path
                    d="M1.5 12s4-7.5 10.5-7.5S22.5 12 22.5 12s-4 7.5-10.5 7.5S1.5 12 1.5 12z"
                  />
                  <circle cx="12" cy="12" r="3" />
                </svg>

                <svg
                  class="eye-off"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <path d="M3 3l18 18" />
                  <path
                    d="M10.6 5.1A10.9 10.9 0 0112 5c6.5 0 10.5 7 10.5 7a13.5 13.5 0 01-3.1 3.9M6.6 6.6C3.5 8.5 1.5 12 1.5 12s4 7 10.5 7a10.7 10.7 0 004.4-.9"
                  />
                  <path d="M9.9 9.9a3 3 0 004.2 4.2" />
                </svg>
              </button>
            </div>

            <label for="aadharInput">Aadhar card number</label>
            <input
              type="text"
              id="aadharInput"
              placeholder="e.g. 123456789012"
              inputmode="numeric"
              maxlength="12"
              required
            />

            <label for="emailInput">Email ID</label>
            <input
              type="email"
              id="emailInput"
              placeholder="e.g. you@email.com"
              autocomplete="email"
              required
            />

            <div class="error" id="signupErrorStep2"></div>

            <div class="btn-row">
              <button type="button" class="btn-back" id="backToStep1Btn">
                Back
              </button>

              <button type="submit" id="signupSubmitBtn">Join the group</button>
            </div>
          </div>
        </form>

        <!-- SUCCESS -->
        <div class="confirm" id="confirmBox">
          <svg
            width="44"
            height="44"
            viewBox="0 0 24 24"
            fill="none"
            style="margin: 0 auto 10px"
          >
            <circle
              cx="12"
              cy="12"
              r="11"
              stroke="#4c7a3d"
              stroke-width="1.5"
            />
            <path
              d="M7 12.5L10.5 16L17 8.5"
              stroke="#1f3d2b"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>

          <p style="margin-bottom: 10px">
            You're in, <strong id="confirmName"></strong>.
          </p>

          <p>See you at Kamlaba Garden Sport Club!</p>

          <a href="#" id="waBtn" class="wa-btn" target="_blank" rel="noopener">
            Chat on WhatsApp
          </a>
        </div>
      </div>

      <footer>
        KAMLABA GARDEN SPORT CLUB — EST. <span id="currentYear"></span>
      </footer>
    </div>

    <script>
      document.getElementById("currentYear").textContent =
        new Date().getFullYear();

      /*
      API ENDPOINTS

      Change these according to your backend.

      Step 1:
      POST /api/auth/send-otp
      body: { phone }

      Step 1 verification:
      POST /api/auth/verify-otp
      body: { phone, otp }

      Final signup:
      POST /api/submit
      body: {
        name,
        phone,
        password,
        aadhar,
        email
      }
    */

      const LOGIN_API_URL = "https://kgsc-server.onrender.com/api/auth/login";

      const SEND_OTP_API_URL =
        "https://kgsc-server.onrender.com/api/auth/send-otp";

      const VERIFY_OTP_API_URL =
        "https://kgsc-server.onrender.com/api/auth/verify-otp";

      const SIGNUP_API_URL = "https://kgsc-server.onrender.com/api/submit";

      const GOOGLE_API_URL = "https://kgsc-server.onrender.com/api/auth/google";

      const CLUB_WHATSAPP_NUMBER = "9725720612";

      const tabs = document.getElementById("tabs");
      const loginTabBtn = document.getElementById("loginTabBtn");
      const signupTabBtn = document.getElementById("signupTabBtn");

      const loginForm = document.getElementById("loginForm");
      const signupForm = document.getElementById("signupForm");

      const cardTitle = document.getElementById("cardTitle");

      const signupStep1 = document.getElementById("signupStep1");
      const signupStep2 = document.getElementById("signupStep2");

      const stepBar = document.getElementById("stepBar");
      const stepLabel = document.getElementById("stepLabel");

      const stepDot1 = document.getElementById("stepDot1");
      const stepDot2 = document.getElementById("stepDot2");

      function goToStep(step) {
        const isStep1 = step === 1;

        signupStep1.classList.toggle("active", isStep1);
        signupStep2.classList.toggle("active", !isStep1);

        stepBar.classList.toggle("done", !isStep1);

        stepDot1.classList.toggle("current", isStep1);
        stepDot1.classList.toggle("done", !isStep1);

        stepDot2.classList.toggle("current", !isStep1);

        stepLabel.textContent = isStep1 ? "Step 1 of 2" : "Step 2 of 2";

        cardTitle.textContent = isStep1
          ? "Verify your phone"
          : "Enter your details";
      }

      function activateTab(tab) {
        const isLogin = tab === "login";

        loginTabBtn.classList.toggle("active", isLogin);
        signupTabBtn.classList.toggle("active", !isLogin);

        loginForm.classList.toggle("active", isLogin);
        signupForm.classList.toggle("active", !isLogin);

        cardTitle.textContent = isLogin
          ? "Log in to your account"
          : "Verify your phone";

        if (!isLogin) {
          goToStep(1);
        }
      }

      loginTabBtn.addEventListener("click", () => activateTab("login"));
      signupTabBtn.addEventListener("click", () => activateTab("signup"));

      /* Password show/hide */
      document.querySelectorAll(".toggle-pw").forEach((btn) => {
        btn.addEventListener("click", () => {
          const target = document.getElementById(btn.dataset.target);
          const isHidden = target.type === "password";

          target.type = isHidden ? "text" : "password";

          btn.classList.toggle("shown", isHidden);

          btn.setAttribute(
            "aria-label",
            isHidden ? "Hide password" : "Show password",
          );
        });
      });

      /* Phone input: digits only */
      const phoneInput = document.getElementById("phoneInput");

      phoneInput.addEventListener("input", () => {
        phoneInput.value = phoneInput.value.replace(/\D/g, "").slice(0, 10);
      });

      /* Aadhar input */
      const aadharInput = document.getElementById("aadharInput");

      aadharInput.addEventListener("input", () => {
        aadharInput.value = aadharInput.value.replace(/\D/g, "").slice(0, 12);
      });

      /* LOGIN */
      const loginError = document.getElementById("loginError");
      const loginSubmitBtn = document.getElementById("loginSubmitBtn");

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const identifier = document
          .getElementById("loginIdentifier")
          .value.trim();

        const password = document.getElementById("loginPassword").value;

        if (!identifier || !password) {
          loginError.textContent = "Please fill in all fields.";
          loginError.classList.add("show");
          return;
        }

        loginError.classList.remove("show");

        loginSubmitBtn.disabled = true;
        loginSubmitBtn.textContent = "Logging in…";

        try {
          const res = await fetch(LOGIN_API_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              identifier,
              password,
            }),
          });

          const data = await res.json();

          if (!res.ok) {
            throw new Error(data.message || "Login failed");
          }

          localStorage.setItem("kgsc_token", data.token);

          window.location.href = "/dashboard.html";
        } catch (err) {
          loginError.textContent =
            err.message || "Something went wrong. Please try again.";

          loginError.classList.add("show");
        } finally {
          loginSubmitBtn.disabled = false;
          loginSubmitBtn.textContent = "Log In";
        }
      });

      /* ============================
       SIGNUP STEP 1 - SEND OTP
       ============================ */

      const sendOtpBtn = document.getElementById("sendOtpBtn");
      const otpSection = document.getElementById("otpSection");
      const signupErrorStep1 = document.getElementById("signupErrorStep1");

      const otpError = document.getElementById("otpError");

      const otpStatus = document.getElementById("otpStatus");

      const verifyOtpBtn = document.getElementById("verifyOtpBtn");

      const resendOtpBtn = document.getElementById("resendOtpBtn");

      const otpInputs = document.querySelectorAll(".otp-input");

      async function sendOTP() {
        const phone = phoneInput.value.trim();

        if (!/^\d{10}$/.test(phone)) {
          signupErrorStep1.textContent = "Enter a valid 10-digit phone number.";

          signupErrorStep1.classList.add("show");
          return;
        }

        signupErrorStep1.classList.remove("show");

        sendOtpBtn.disabled = true;
        sendOtpBtn.textContent = "Sending OTP…";

        try {
          const res = await fetch(SEND_OTP_API_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              phone,
            }),
          });

          const data = await res.json();

          if (!res.ok) {
            throw new Error(data.message || "Unable to send OTP.");
          }

          otpSection.classList.remove("hide");

          otpStatus.textContent = data.message || "OTP sent to your phone.";

          otpInputs[0].focus();
        } catch (err) {
          signupErrorStep1.textContent = err.message || "Unable to send OTP.";

          signupErrorStep1.classList.add("show");
        } finally {
          sendOtpBtn.disabled = false;
          sendOtpBtn.textContent = "Send OTP";
        }
      }

      sendOtpBtn.addEventListener("click", sendOTP);

      /* OTP input behaviour */
      otpInputs.forEach((input, index) => {
        input.addEventListener("input", () => {
          input.value = input.value.replace(/\D/g, "").slice(0, 1);

          if (input.value && index < otpInputs.length - 1) {
            otpInputs[index + 1].focus();
          }
        });

        input.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && !input.value && index > 0) {
            otpInputs[index - 1].focus();
          }
        });

        input.addEventListener("paste", (e) => {
          e.preventDefault();

          const pasted = e.clipboardData
            .getData("text")
            .replace(/\D/g, "")
            .slice(0, 6);

          pasted.split("").forEach((digit, i) => {
            if (otpInputs[i]) {
              otpInputs[i].value = digit;
            }
          });

          if (pasted.length) {
            otpInputs[Math.min(pasted.length, 6) - 1].focus();
          }
        });
      });

      /* VERIFY OTP */
      verifyOtpBtn.addEventListener("click", async () => {
        const phone = phoneInput.value.trim();

        const otp = [...otpInputs].map((input) => input.value).join("");

        if (otp.length !== 6) {
          otpError.textContent = "Please enter the 6-digit OTP.";

          otpError.classList.add("show");

          return;
        }

        otpError.classList.remove("show");

        verifyOtpBtn.disabled = true;
        verifyOtpBtn.textContent = "Verifying…";

        try {
          const res = await fetch(VERIFY_OTP_API_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              phone,
              otp,
            }),
          });

          const data = await res.json();

          if (!res.ok) {
            throw new Error(data.message || "Invalid OTP.");
          }

          /*
          OTP verified.

          Keep phone number in memory.
          Move user to Step 2.
        */

          phoneInput.dataset.verified = "true";

          goToStep(2);

          document.getElementById("nameInput").focus();
        } catch (err) {
          otpError.textContent = err.message || "OTP verification failed.";

          otpError.classList.add("show");
        } finally {
          verifyOtpBtn.disabled = false;
          verifyOtpBtn.textContent = "Verify OTP";
        }
      });

      /* RESEND OTP */
      resendOtpBtn.addEventListener("click", async () => {
        otpInputs.forEach((input) => {
          input.value = "";
        });

        otpError.classList.remove("show");

        await sendOTP();
      });

      /* BACK */
      document
        .getElementById("backToStep1Btn")
        .addEventListener("click", () => {
          document.getElementById("signupErrorStep2").classList.remove("show");

          goToStep(1);
        });

      /* SIGNUP FINAL SUBMIT */
      const signupSubmitBtn = document.getElementById("signupSubmitBtn");

      const signupErrorStep2 = document.getElementById("signupErrorStep2");

      const confirmBox = document.getElementById("confirmBox");

      const confirmName = document.getElementById("confirmName");

      const waBtn = document.getElementById("waBtn");

      signupForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const phone = phoneInput.value.trim();

        const name = document.getElementById("nameInput").value.trim();

        const password = document.getElementById("signupPassword").value;

        const aadhar = aadharInput.value.trim();

        const email = document.getElementById("emailInput").value.trim();

        if (phoneInput.dataset.verified !== "true") {
          signupErrorStep2.textContent =
            "Please verify your phone number first.";

          signupErrorStep2.classList.add("show");

          return;
        }

        if (!name || !password || !aadhar || !email) {
          signupErrorStep2.textContent = "Please fill in all fields.";

          signupErrorStep2.classList.add("show");

          return;
        }

        if (password.length < 6) {
          signupErrorStep2.textContent =
            "Password must be at least 6 characters.";

          signupErrorStep2.classList.add("show");

          return;
        }

        if (aadhar.length !== 12) {
          signupErrorStep2.textContent =
            "Aadhar number must be exactly 12 digits.";

          signupErrorStep2.classList.add("show");

          return;
        }

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          signupErrorStep2.textContent = "Enter a valid email address.";

          signupErrorStep2.classList.add("show");

          return;
        }

        signupErrorStep2.classList.remove("show");

        signupSubmitBtn.disabled = true;
        signupSubmitBtn.textContent = "Joining…";

        try {
          const res = await fetch(SIGNUP_API_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              name,
              phone,
              password,
              aadhar,
              email,
            }),
          });

          const data = await res.json().catch(() => ({}));

          if (!res.ok) {
            throw new Error(data.message || "Unable to create account.");
          }

          confirmName.textContent = name;

          tabs.classList.add("hide");

          cardTitle.style.display = "none";

          signupForm.classList.add("hide");

          confirmBox.classList.add("show");

          const waMessage = encodeURIComponent(
            `Hi! I just registered for KGSC 🎉\n\n` +
              `*Name:* ${name}\n` +
              `*Phone:* ${phone}\n` +
              `*Email:* ${email}`,
          );

          waBtn.href = `https://wa.me/${CLUB_WHATSAPP_NUMBER}?text=${waMessage}`;
        } catch (err) {
          signupErrorStep2.textContent =
            err.message || "Something went wrong. Please try again.";

          signupErrorStep2.classList.add("show");

          signupSubmitBtn.disabled = false;
          signupSubmitBtn.textContent = "Join the group";
        }
      });

      /* GOOGLE */
      document
        .getElementById("googleLoginBtn")
        .addEventListener("click", () => {
          window.location.href = GOOGLE_API_URL;
        });

      document
        .getElementById("googleSignupBtn")
        .addEventListener("click", () => {
          window.location.href = GOOGLE_API_URL;
        });
    </script>
  </body>
</html>
